[project]
name = "ralph"
version = "0.1.0"
description = "Command-line interface for Ralph"
requires-python = ">=3.12"
dependencies = [
    "openai-codex>=0.154.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
ralph = "ralph:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["ralph"]

[tool.setuptools.data-files]
"share/ralph/skills/prd" = ["skills/prd/SKILL.md"]
"share/ralph/skills/convert" = ["skills/convert/SKILL.md"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 112
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]
